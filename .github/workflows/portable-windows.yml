name: Portable Windows App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "pyproject.toml"
      - "packaging/**"
      - "tools/launch_game.py"
      - ".github/workflows/portable-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "packaging/**"
      - "tools/launch_game.py"
      - ".github/workflows/portable-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install game and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller==6.22.3

      - name: Build portable Windows application
        run: python -m PyInstaller --clean --noconfirm packaging/KlondikeSolitaire.spec

      - name: Verify executable and bundled assets
        shell: pwsh
        run: |
          $bundle = Resolve-Path "dist\KlondikeSolitaire"
          $exe = Join-Path $bundle "KlondikeSolitaire.exe"
          if (-not (Test-Path $exe)) {
            throw "Portable executable was not created: $exe"
          }

          foreach ($asset in @("card-back.svg", "felt-weave.png", "victory.wav")) {
            $match = Get-ChildItem -Path $bundle -Recurse -File -Filter $asset | Select-Object -First 1
            if ($null -eq $match) {
              throw "Required bundled asset is missing: $asset"
            }
          }
          Write-Host "Executable and required artwork/audio assets are present."

      - name: Smoke-test portable application startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "dist\KlondikeSolitaire\KlondikeSolitaire.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Portable application exited during startup (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Portable application remained running during the startup smoke test."

      - name: Create Windows portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\KlondikeSolitaire" -DestinationPath "dist\KlondikeSolitaire-Windows.zip" -CompressionLevel Optimal

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlondikeSolitaire-Windows
          path: dist/KlondikeSolitaire-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/KlondikeSolitaire-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
