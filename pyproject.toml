[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klondike-solitaire-dsa"
version = "0.1.0"
description = "A Klondike Solitaire desktop game demonstrating core data structures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
